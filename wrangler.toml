name = "tagro-os-core"
main = "src/worker.js"
compatibility_date = "2026-07-02"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[assets]
directory = "./tagros"
binding = "ASSETS"

[[routes]]
pattern = "os.tagro.in"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "tagro-os"
database_id = "4f53e926-c25c-4279-aa14-8ca759a4ed4a"
migrations_dir = "migrations"

[[d1_databases]]
binding = "HISTORY_DB"
database_name = "tagro-history"
database_id = "0b9aa09d-0c2f-482f-bf90-d390329ec0c9"

[[kv_namespaces]]
binding = "TAGRO_DATA"
id = "3a0fd40900114bb1861163a861dcf7e1"
remote = true

[[r2_buckets]]
binding = "MANUALS"
bucket_name = "tagro-manuals"
remote = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[env.staging]
name = "tagro-os-core-staging"
workers_dev = true
preview_urls = true
routes = []

  [env.staging.vars]
  ENVIRONMENT = "staging"

  [[env.staging.d1_databases]]
  binding = "DB"
  database_name = "tagro-os-staging"
  database_id = "ac5807d2-3e6a-4e10-b77e-68692e21f06a"
  migrations_dir = "migrations"

  # Historical warehouse is immutable and is queried read-only by TAGRO OS.
  [[env.staging.d1_databases]]
  binding = "HISTORY_DB"
  database_name = "tagro-history"
  database_id = "0b9aa09d-0c2f-482f-bf90-d390329ec0c9"

  [[env.staging.kv_namespaces]]
  binding = "TAGRO_DATA"
  id = "cd758d9505544f84a9158b3fcc722328"

  [[env.staging.r2_buckets]]
  binding = "MANUALS"
  bucket_name = "tagro-manuals"

  [env.staging.observability]
  enabled = true

    [env.staging.observability.logs]
    enabled = true
    head_sampling_rate = 1

    [env.staging.observability.traces]
    enabled = true
    head_sampling_rate = 0.01
