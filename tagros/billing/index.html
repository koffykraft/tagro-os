<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f56722">
<title>TAGRO Billing</title>
<style>
:root{--orange:#ef6a1f;--deep:#b94513;--ink:#251d17;--muted:#75675d;--paper:#f7f1e8;--card:#fffdf9;--line:#e5d7c7;--green:#176b50;--red:#af2c1e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(100%,920px);margin:auto;padding:12px 10px 90px}.top{display:flex;align-items:center;gap:10px}.top img{object-fit:contain}.tagro{width:116px}.stihl{width:70px;margin-left:auto}.top h1{font:700 24px Georgia;margin:0}.top small{display:block;color:var(--muted);font-size:9px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#e8ddcf;padding:5px;border-radius:14px;margin:12px 0}.modes button{border:0;background:transparent;padding:10px 3px;border-radius:10px;font-size:10px;font-weight:900;color:var(--muted)}.modes .active{background:#fff;color:var(--deep)}.defaults,.grid3,.grid2{display:grid;gap:8px}.defaults{grid-template-columns:1fr 1fr auto}.grid3{grid-template-columns:1.1fr 1fr 1fr}.grid2{grid-template-columns:1fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0}.card h2{font:700 18px Georgia;margin:0 0 10px}.head{display:flex;justify-content:space-between;align-items:center}.head span{font-size:10px;color:var(--muted)}label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:10px;font-weight:800}input,select,textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:3px solid #ef6a1f22;border-color:var(--orange)}.phone input,.search input{border:2px solid var(--ink)}.tiles{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.tiles button{flex:0 0 auto;border:1px solid #efc6ac;background:#fff4eb;border-radius:10px;padding:8px 11px;font-size:10px;font-weight:900}.search{position:relative}.results{position:absolute;z-index:4;left:0;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px #1d110c25;max-height:45vh;overflow:auto}.results button{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:10px}.results b,.results small{display:block}.results small{color:var(--muted);margin-top:3px}.lines{margin-top:8px}.line{display:grid;grid-template-columns:minmax(0,1fr) 58px 82px 92px;gap:5px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.line.headrow{font-size:8px;text-transform:uppercase;color:var(--muted);font-weight:900}.line strong,.line small{display:block}.line strong{font-size:11px}.line small{font-size:8px;color:var(--muted);margin-top:2px}.line input{min-height:35px;padding:5px;text-align:right}.amount{text-align:right;font-size:10px;font-weight:900}.remove{border:0;background:#f6e8df;color:var(--red);border-radius:50%;margin-left:4px}.subtle{font-size:9px;color:var(--muted)}textarea{min-height:58px}.bar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:min(calc(100% - 16px),900px);display:grid;grid-template-columns:1fr 1fr 1.2fr 105px;background:var(--ink);color:#fff;border-radius:15px;padding:8px;gap:5px;box-shadow:0 10px 30px #27160d55}.bar div{display:flex;flex-direction:column;padding-left:5px}.bar small{font-size:7px;color:#cfc4bb;text-transform:uppercase}.bar b{font-size:12px}.bar .grand b{color:#ff9a58;font-size:16px}.bar button{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:900}.overlay{position:fixed;inset:0;z-index:20;background:#1e1712dd;padding:10px;display:grid;place-items:center}.hidden{display:none!important}.modal{width:min(100%,760px);max-height:95vh;overflow:auto;background:#fff;border-radius:18px;padding:15px}.tools{display:flex;justify-content:space-between;gap:6px;margin-bottom:10px}.tools button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-weight:800}.tools .primary{background:var(--orange);color:#fff;border-color:var(--orange)}.paper{border:1px solid var(--line);padding:20px}.paper header{display:flex;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:10px}.paper header img{width:110px}.paper h2{font:700 23px Georgia;margin:4px 0}.paper table{width:100%;border-collapse:collapse;font-size:10px;margin-top:12px}.paper th{background:#f4eadf;text-align:left}.paper th,.paper td{padding:7px;border-bottom:1px solid var(--line)}.paper td:nth-child(n+3),.paper th:nth-child(n+3){text-align:right}.paper .totals{width:min(100%,300px);margin:12px 0 0 auto}.paper .totals div{display:flex;justify-content:space-between;padding:4px}.paper .total{border-top:2px solid var(--ink);font-size:16px;color:var(--deep)}.payment{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.payment canvas{width:140px!important;height:140px!important}.paybuttons{display:flex;gap:6px;flex-wrap:wrap}.paybuttons a,.paybuttons button{border:0;border-radius:9px;background:#fff0e6;color:var(--deep);padding:9px;font-weight:900;text-decoration:none}.report-list{font-size:11px}.report-row{display:grid;grid-template-columns:100px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.quiet-note{background:#faf6f1;border-left:3px solid #d8bba7;padding:9px;margin-top:12px;font-size:9px;color:var(--muted)}
@media(max-width:620px){.tagro{width:88px}.stihl{width:54px}.top h1{font-size:20px}.defaults{grid-template-columns:1fr 1fr}.defaults .series{display:none}.grid3{grid-template-columns:1fr 1fr}.phone{grid-column:span 2}.line{grid-template-columns:minmax(105px,1fr) 46px 65px 70px}.bar{grid-template-columns:1fr 1fr 1.2fr 82px}.bar button{font-size:9px}.payment{grid-template-columns:1fr}.payment canvas{margin:auto}}@media print{body{background:#fff}.shell,.tools{display:none!important}.overlay{position:static;background:#fff;padding:0;display:block}.modal{max-height:none;width:100%;padding:0;overflow:visible}.paper{border:0;padding:8mm}}
</style>
</head>
<body>
<main class="shell"><header class="top"><img class="tagro" src="../tagro-logo.png" alt="TAGRO"><div><h1 id="pageTitle">New sale</h1><small>BUSY BRIDGE · MOBILE BILLING</small></div><img class="stihl" src="./stihl-logo.png" alt="STIHL"></header>
<nav class="modes" id="modes"><button data-mode="invoice" class="active">Invoice</button><button data-mode="estimate">Estimate</button><button data-mode="quotation">Quotation</button><button data-mode="stock_count">Stock count</button></nav>
<section class="card defaults"><label>Branch<select id="branch"><option>KVR</option><option>PKM</option><option>NDD</option><option>MDM</option><option>SKT</option></select></label><label>Date<input id="date" type="date"></label><label class="series">Series<input id="series" value="WEB SALES" readonly></label></section>
<section class="card" id="customerCard"><div class="head"><h2>Customer</h2><span>Phone fills saved details</span></div><div class="grid3"><label class="phone">Phone<input id="phone" inputmode="tel" placeholder="10-digit phone"></label><label>Name<input id="customer" placeholder="Cash customer"></label><label>Place<input id="place" placeholder="Town / place"></label></div><div class="grid3" style="margin-top:8px"><label>Machine<input id="machine" list="models" placeholder="Model"></label><label>Serial number<input id="serial"></label><label>Payment<select id="payment"><option>Cash</option><option>Bank / UPI</option><option>Mixed</option><option>Pending</option></select></label></div><datalist id="models"><option>MS 170</option><option>MS 180</option><option>MS 230</option><option>MS 250</option><option>MS 382</option><option>MS 460</option><option>MS 462</option><option>FS 120</option><option>FS 250</option><option>BR 600</option></datalist></section>
<section class="card"><div class="head"><h2 id="itemsTitle">Items</h2><span id="catalogStatus">Loading catalogue…</span></div><div class="tiles" id="tiles"><button data-pack="chain">36RSC · 66 links</button><button data-pack="file4">4 mm file</button><button data-pack="file52">5.2 mm file</button></div><div class="search"><input id="search" autocomplete="off" placeholder="Item name or part number — Enter adds"><div class="results hidden" id="results"></div></div><div class="lines"><div class="line headrow"><span>Item</span><span id="q1">Qty</span><span id="q2">Rate</span><span id="q3">Amount</span></div><div id="lineRows" class="subtle" style="padding:14px;text-align:center">Search or tap a frequent item.</div></div><div class="grid2" id="extras" style="margin-top:10px"><label>Service / labour<input id="service" type="number" value="0" min="0"></label><label>UPI ID<input id="upi" placeholder="Enter branch UPI ID"></label></div><label style="margin-top:8px">Narration / note<textarea id="note" placeholder="Customer, machine or work details"></textarea></label></section>
<section class="card"><div class="head"><h2>Today</h2><button id="openReport" style="border:0;background:transparent;color:var(--deep);font-weight:900">Branch evening report →</button></div><div class="subtle" id="dayBrief">No saved invoices on this phone today.</div></section>
<section class="bar"><div><small>Taxable</small><b id="taxable">₹0</b></div><div><small>GST</small><b id="gst">₹0</b></div><div class="grand"><small>Total</small><b id="total">₹0</b></div><button id="review">Review</button></section></main>
<div class="overlay hidden" id="overlay"><div class="modal"><div class="tools"><button id="edit">← Edit</button><button id="print">Print / PDF</button><button class="primary" id="save">Save invoice</button></div><article class="paper" id="paper"></article></div></div>
<div class="overlay hidden" id="reportOverlay"><div class="modal"><div class="tools"><button id="closeReport">← Billing</button><span><b>Branch evening report</b></span><button class="primary" id="shareReport">Share</button></div><div id="reportBody"></div></div></div>
<script src="./qrcode.min.js"></script>
<script src="./pdf.js"></script>
<script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));
let mode='invoice',catalog=[],lines=[],active=0; $('date').value=new Date().toISOString().slice(0,10);
const modes={invoice:['New sale','WEB SALES'],estimate:['New estimate','WEB ESTIMATE'],quotation:['New quotation','WEB QUOTE'],stock_count:['Stock count','COUNT DRAFT']};
const customers=()=>JSON.parse(localStorage.getItem('tagro.billing.customers.v1')||'{}');
const dayKey=()=>`tagro.billing.documents.${$('branch').value}.${$('date').value}`;
fetch('./catalogue.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{catalog=(d.items||[]).map(x=>({name:x.n,alias:x.p,group:x.g||x.f||x.c,rate:Number(x.rate||0),gst:Number(x.gst||18),source:x.source_branch||'Warehouse'})).filter(x=>x.name&&x.alias);$('catalogStatus').textContent=`${catalog.length.toLocaleString('en-IN')} warehouse items`}).catch(()=>$('catalogStatus').textContent='Catalogue unavailable');
$('modes').onclick=e=>{let b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('active',x===b));$('pageTitle').textContent=modes[mode][0];$('series').value=modes[mode][1];let count=mode==='stock_count';$('customerCard').classList.toggle('hidden',count);$('extras').classList.toggle('hidden',count);$('tiles').classList.toggle('hidden',count);$('itemsTitle').textContent=count?'Count items':'Items';$('q1').textContent=count?'Book':'Qty';$('q2').textContent=count?'Count':'Rate';$('q3').textContent=count?'Variance':'Amount';lines=[];render()};
$('phone').oninput=()=>{let d=$('phone').value.replace(/\D/g,'').slice(-10);$('phone').value=d;let hit=customers()[d];if(hit){$('customer').value=hit.name||'';$('place').value=hit.place||'';$('machine').value=hit.machine||'';$('serial').value=hit.serial||''}};
function find(q){let w=q.toLowerCase().trim().split(/\s+/).filter(Boolean);return w.length?catalog.filter(x=>w.every(a=>(x.name+' '+x.alias+' '+x.group).toLowerCase().includes(a))).slice(0,15):[]}
function results(){let rows=find($('search').value);$('results').classList.toggle('hidden',!rows.length);$('results').innerHTML=rows.map((x,i)=>`<button data-i="${i}"><b>${x.name}</b><small>${x.alias} · ${x.group}</small></button>`).join('');$('results').onclick=e=>{let b=e.target.closest('button');if(b)add(rows[+b.dataset.i])}}
$('search').oninput=results;$('search').onkeydown=e=>{let rows=find($('search').value);if(e.key==='Enter'&&rows.length){e.preventDefault();add(rows[active]||rows[0])}};
function add(x,qty=1){let old=lines.find(y=>y.alias===x.alias);if(old&&!mode.includes('stock'))old.qty+=qty;else if(!old)lines.push({...x,qty:mode==='stock_count'?0:qty,book:0});$('search').value='';$('results').classList.add('hidden');render();$('search').focus()}
$('tiles').onclick=e=>{let p=e.target.dataset.pack;if(p==='chain')add(catalog.find(x=>x.alias==='36210001640')||{name:'36RSC Sawchain STIHL 1.6mm-3/8"',alias:'36210001640',group:'Saw Chain',rate:12.84,gst:18},66);if(p==='file4')add(catalog.find(x=>x.alias==='56057734006')||{name:'4 MM Round File (STIHL)',alias:'56057734006',group:'Files',rate:84.74,gst:18});if(p==='file52')add(catalog.find(x=>x.alias==='56057735206')||{name:'5.2 MM Round File (STIHL)',alias:'56057735206',group:'Files',rate:84.74,gst:18})};
function render(){let count=mode==='stock_count';$('lineRows').className='';$('lineRows').innerHTML=lines.length?lines.map((x,i)=>`<div class="line"><span><strong>${i+1}. ${x.name}</strong><small>${x.alias} · ${x.group}</small></span>${count?`<input data-book="${i}" type="number" value="${x.book}"><input data-qty="${i}" type="number" value="${x.qty}"><span class="amount">${x.qty-x.book}<button class="remove" data-rm="${i}">×</button></span>`:`<input data-qty="${i}" type="number" step=".01" value="${x.qty}"><input data-rate="${i}" type="number" step=".01" value="${x.rate}"><span class="amount">${money(x.qty*x.rate)}<button class="remove" data-rm="${i}">×</button></span>`}</div>`).join(''):'<div class="subtle" style="padding:14px;text-align:center">Search or tap a frequent item.</div>';$('lineRows').querySelectorAll('input').forEach(x=>x.oninput=()=>{let i=+(x.dataset.qty??x.dataset.rate??x.dataset.book);if(x.dataset.qty!==undefined)lines[i].qty=+x.value;if(x.dataset.rate!==undefined)lines[i].rate=+x.value;if(x.dataset.book!==undefined)lines[i].book=+x.value;renderTotals()});$('lineRows').onclick=e=>{let b=e.target.closest('[data-rm]');if(b){lines.splice(+b.dataset.rm,1);render()}};renderTotals()}
function totals(){let taxable=lines.reduce((s,x)=>s+x.qty*x.rate,0)+(mode==='stock_count'?0:+$('service').value||0),gst=mode==='stock_count'?0:lines.reduce((s,x)=>s+x.qty*x.rate*x.gst/100,0)+(+$('service').value||0)*.18;return{taxable,gst,total:taxable+gst}}
function renderTotals(){let t=totals();$('taxable').textContent=mode==='stock_count'?`${lines.length} lines`:money(t.taxable);$('gst').textContent=mode==='stock_count'?`Δ ${lines.reduce((s,x)=>s+x.qty-x.book,0)}`:money(t.gst);$('total').textContent=mode==='stock_count'?'Draft':money(t.total)}$('service').oninput=renderTotals;
function doc(){let t=totals();return{id:crypto.randomUUID(),mode,branch:$('branch').value,date:$('date').value,series:$('series').value,customer:{phone:$('phone').value,name:$('customer').value,place:$('place').value,machine:$('machine').value,serial:$('serial').value},payment:$('payment').value,note:$('note').value,upi:$('upi').value,lines:structuredClone(lines),totals:t,created:new Date().toISOString()}}
function preview(d){let count=d.mode==='stock_count',upi=d.upi&&d.totals.total?`upi://pay?pa=${encodeURIComponent(d.upi)}&pn=${encodeURIComponent('Thumpassery Agro '+d.branch)}&am=${d.totals.total.toFixed(2)}&cu=INR&tn=${encodeURIComponent(d.series+' '+d.date)}`:'';$('paper').innerHTML=`<header><div><img src="../tagro-logo.png"><h2>${d.mode.replace('_',' ').toUpperCase()}</h2></div><div style="text-align:right"><b>${d.branch}</b><br>${d.date}<br><small>${d.series}</small></div></header>${count?'':`<p><b>${d.customer.name||'Cash'}</b> · ${d.customer.phone||'No phone'} · ${d.customer.place||'Place not entered'}<br><small>${d.customer.machine||''} ${d.customer.serial?'· Serial '+d.customer.serial:''}</small></p>`}<table><thead><tr><th>#</th><th>Item</th><th>${count?'Book':'Qty'}</th><th>${count?'Count':'Rate'}</th><th>${count?'Variance':'Amount'}</th></tr></thead><tbody>${d.lines.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b><br><small>${x.alias}</small></td><td>${count?x.book:x.qty}</td><td>${count?x.qty:money(x.rate)}</td><td>${count?x.qty-x.book:money(x.qty*x.rate)}</td></tr>`).join('')}</tbody></table>${count?'':`<div class="totals"><div><span>Taxable</span><b>${money(d.totals.taxable)}</b></div><div><span>GST</span><b>${money(d.totals.gst)}</b></div><div class="total"><span>Total</span><b>${money(d.totals.total)}</b></div></div>${upi?`<div class="payment"><canvas id="qr"></canvas><div><b>Pay by any UPI app</b><p class="subtle">${d.upi}</p><div class="paybuttons"><a href="${upi}">Open UPI</a><button id="wa">Share on WhatsApp</button></div></div></div>`:''}`}`;if(upi&&window.QRCode)QRCode.toCanvas($('qr'),upi,{width:280,margin:1});setTimeout(()=>{let wa=$('wa');if(wa)wa.onclick=()=>shareInvoice(d,upi)},0)}
$('review').onclick=()=>{if(!lines.length)return;preview(doc());$('overlay').classList.remove('hidden')};$('edit').onclick=()=>$('overlay').classList.add('hidden');$('print').onclick=()=>window.print();
$('save').onclick=()=>{let d=doc(),all=JSON.parse(localStorage.getItem(dayKey())||'[]');all.push(d);localStorage.setItem(dayKey(),JSON.stringify(all));if(d.customer.phone){let c=customers();c[d.customer.phone]={...d.customer};localStorage.setItem('tagro.billing.customers.v1',JSON.stringify(c))}preview(d);dayBrief();$('save').textContent='Saved';setTimeout(()=>$('save').textContent='Save invoice',1200)};
async function shareInvoice(d,upi){let text=`TAGRO ${d.mode} · ${d.branch} · ${d.date}\nTotal ${money(d.totals.total)}\n${upi?'UPI payment: '+upi:''}`,files=[];if(window.jspdf){let pdf=new jspdf.jsPDF({unit:'mm',format:'a4'}),y=18;pdf.setFontSize(18);pdf.text('TAGRO '+d.mode.toUpperCase(),14,y);pdf.setFontSize(10);y+=8;pdf.text(`${d.branch} · ${d.date} · ${d.series}`,14,y);y+=7;pdf.text(`${d.customer.name||'Cash'} · ${d.customer.phone||''} · ${d.customer.place||''}`,14,y);y+=9;d.lines.forEach((x,i)=>{if(y>270){pdf.addPage();y=18}pdf.text(`${i+1}. ${x.name} (${x.alias})`,14,y);pdf.text(`${x.qty} x ${x.rate.toFixed(2)} = ${(x.qty*x.rate).toFixed(2)}`,135,y);y+=6});y+=4;pdf.setFontSize(12);pdf.text(`Taxable: ${d.totals.taxable.toFixed(2)}   GST: ${d.totals.gst.toFixed(2)}   Total: ${d.totals.total.toFixed(2)}`,14,y);if(upi){y+=9;pdf.setFontSize(9);pdf.text('UPI payment link:',14,y);y+=5;pdf.text(upi,14,y,{maxWidth:180})}let blob=pdf.output('blob');files=[new File([blob],`TAGRO_${d.branch}_${d.date}_${d.id.slice(0,8)}.pdf`,{type:'application/pdf'})]}if(navigator.share&&(!files.length||!navigator.canShare||navigator.canShare({files})))await navigator.share({title:`TAGRO ${d.mode}`,text,files});else location.href='https://wa.me/?text='+encodeURIComponent(text)}
function saved(){return JSON.parse(localStorage.getItem(dayKey())||'[]')}function dayBrief(){let a=saved().filter(x=>x.mode==='invoice'),sum=a.reduce((s,x)=>s+x.totals.total,0);$('dayBrief').textContent=a.length?`${a.length} invoices · ${money(sum)} sales on this phone`:'No saved invoices on this phone today.'}dayBrief();$('branch').onchange=dayBrief;$('date').onchange=dayBrief;
function report(){let a=saved().filter(x=>x.mode==='invoice'),sum=a.reduce((s,x)=>s+x.totals.total,0),missing=[];a.forEach(d=>d.lines.forEach(x=>{if(!x.rate&&!missing.some(y=>y.alias===x.alias))missing.push(x)}));$('reportBody').innerHTML=`<div class="card"><h2>${$('branch').value} · ${$('date').value}</h2><p><b>${money(sum)}</b> sales · ${a.length} invoices</p></div><div class="card report-list">${a.length?a.map(x=>`<div class="report-row"><span>${x.created.slice(11,16)}</span><span>${x.customer.name||'Cash'} · ${x.lines.length} items</span><b>${money(x.totals.total)}</b></div>`).join(''):'No invoices saved on this phone.'}${missing.length?`<div class="quiet-note">Subnote · ${missing.length} items do not have purchase/sale prices in the connected catalogue. Please clarify with Owner: ${missing.map(x=>x.name).join(', ')}.</div>`:''}</div>`;$('reportOverlay').classList.remove('hidden')}
$('openReport').onclick=report;$('closeReport').onclick=()=>$('reportOverlay').classList.add('hidden');$('shareReport').onclick=async()=>{let a=saved().filter(x=>x.mode==='invoice'),sum=a.reduce((s,x)=>s+x.totals.total,0),text=`${$('branch').value} sales · ${$('date').value}\n${a.length} invoices · ${money(sum)}`;if(navigator.share)await navigator.share({title:'TAGRO branch report',text});else location.href='https://wa.me/?text='+encodeURIComponent(text)};
</script>
</body></html>
