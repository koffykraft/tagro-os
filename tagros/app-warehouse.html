<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warehouse — TAGRO OS</title>
<link rel="stylesheet" href="os-shell.css">
<script src="os-manifest.js"></script>
<script src="os-core.js"></script>
<script src="app-shell.js"></script>
<style>
.warehouse{max-width:1180px;margin:auto;padding:20px}.filters{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}.field{display:grid;gap:6px}.field>span,.total span{color:#666;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.filters input,.filters select{width:100%;min-height:48px;padding:13px;border:1px solid #ccc;border-radius:12px;background:#fff;font:inherit}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.total{border:1px solid #ddd;border-radius:16px;padding:16px}.total span{display:block;margin-bottom:7px}.total strong{font-size:26px}.table{overflow:auto;border:1px solid #ddd;border-radius:16px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee}tr[data-id]{cursor:pointer}.detail{margin-top:16px;border:1px solid #ddd;border-radius:16px;padding:16px}.hidden{display:none}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.field-search{grid-column:1/-1}.totals{grid-template-columns:repeat(3,1fr)}.warehouse{padding:14px}.total{padding:12px}.total strong{font-size:18px}}
</style>
</head>
<body>
<header class="app-topbar"><a class="back-button" href="index.html">‹</a><div class="app-topbar-title"><strong>Warehouse</strong><span id="scope">Historical records</span></div><a class="brand-logo" href="index.html"><img src="tagro-logo.png" alt="TAGRO"></a></header>
<main class="warehouse">
<section class="page-heading"><div><p class="eyebrow">Recorded transactions</p><h1>Sales and purchases</h1></div></section>
<div class="filters">
  <label class="field"><span>Branch</span><select id="branch"></select></label>
  <label class="field"><span>Transaction</span><select id="kind"><option value="sales">Sales</option><option value="purchases">Purchases</option><option value="purchase-returns">Purchase returns</option></select></label>
  <label class="field"><span>From date</span><input id="from" type="date"></label>
  <label class="field"><span>To date</span><input id="to" type="date"></label>
  <label class="field field-search"><span>Find</span><input id="q" placeholder="Invoice, customer or item"></label>
</div>
<div class="totals">
  <div class="total"><span>Invoice count</span><strong id="vouchers">—</strong></div>
  <div class="total"><span id="beforeTitle">Sales before GST</span><strong id="before">—</strong></div>
  <div class="total"><span id="amountTitle">Sales including GST</span><strong id="amount">—</strong></div>
</div>
<div class="table"><table><thead><tr><th>Date</th><th>Branch</th><th>Invoice number</th><th>Customer</th><th>Before GST</th><th>Including GST</th></tr></thead><tbody id="rows"></tbody></table></div>
<section class="detail hidden" id="detail"></section>
</main>
<script>
let session,branchInfo=[];
const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString('en-IN',{style:'currency',currency:'INR'});
const esc=v=>OS.esc(String(v??''));
addEventListener('DOMContentLoaded',boot);

async function boot(){
  session=await Session.restore();
  if(!session){location.replace('login.html');return}
  $('scope').textContent=session.role==='owner'?'Branch records':session.branch+' · '+session.branchName;
  const data=await Api.request('/warehouse/branches');
  branchInfo=data.branches||[];
  $('branch').multiple=session.role==='owner';
  $('branch').innerHTML=branchInfo.map(b=>`<option value="${esc(b.branch)}">${esc(b.branch)}</option>`).join('');
  if(session.role!=='owner') $('branch').value=session.branch;
  else {
    const preferred=[...$('branch').options].find(o=>o.value==='KVR')||$('branch').options[0];
    if(preferred) preferred.selected=true;
  }
  setDateRange(true);
  bind();
  await load();
}

function selectedBranches(){return [...$('branch').selectedOptions].map(o=>o.value).filter(Boolean)}

function setDateRange(reset=false){
  const chosen=selectedBranches();
  const rows=branchInfo.filter(b=>chosen.includes(b.branch));
  if(!rows.length)return;
  const first=rows.map(b=>b.first_date).filter(Boolean).sort()[0];
  const last=rows.map(b=>b.last_date).filter(Boolean).sort().at(-1);
  if(first){
    const monthStart=first.slice(0,7)+'-01';
    $('from').min=monthStart;
    if(reset||!$('from').value||$('from').value<monthStart)$('from').value=monthStart;
  }
  if(last){
    $('from').max=last;
    $('to').max=last;
    if(reset||!$('to').value||$('to').value>last)$('to').value=last;
  }
  if($('to').value<$('from').value)$('to').value=$('from').value;
}

function bind(){
  $('branch').onchange=()=>{setDateRange(true);load()};
  $('kind').onchange=load;
  $('from').onchange=()=>{setDateRange();load()};
  $('to').onchange=()=>{setDateRange();load()};
  let timer;
  $('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,350)};
}

function params(){
  const p=new URLSearchParams({kind:$('kind').value,transfer_mode:'exclude'});
  const branches=selectedBranches();
  if(branches.length)p.set('branches',branches.join(','));
  if($('from').value)p.set('from',$('from').value);
  if($('to').value)p.set('to',$('to').value);
  if($('q').value)p.set('q',$('q').value);
  return p;
}

async function load(){
  const p=params(),label=$('kind').selectedOptions[0].textContent;
  const [summary,data]=await Promise.all([Api.request('/warehouse/summary?'+p),Api.request('/warehouse/transactions?'+p)]);
  $('beforeTitle').textContent=label+' before GST';
  $('amountTitle').textContent=label+' including GST';
  $('vouchers').textContent=Number(summary.vouchers?.voucher_count||0).toLocaleString('en-IN');
  $('before').textContent=money(summary.vouchers?.before_tax);
  $('amount').textContent=money(summary.vouchers?.total);
  $('rows').innerHTML=(data.rows||[]).map(r=>`<tr data-id="${esc(r.voucher_id)}"><td>${esc(r.vch_date)}</td><td>${esc(r.branch)}</td><td><strong>${esc(r.vch_no)}</strong></td><td>${esc(r.party_name||r.narration1||'—')}</td><td>${money(r.taxable_amount)}</td><td>${money(r.total_amount)}</td></tr>`).join('')||'<tr><td colspan="6">No records found.</td></tr>';
  [...document.querySelectorAll('tr[data-id]')].forEach(row=>row.onclick=()=>openDetail(row.dataset.id));
}

async function openDetail(id){
  const d=await Api.request('/warehouse/transaction/'+encodeURIComponent(id));
  $('detail').classList.remove('hidden');
  $('detail').innerHTML=`<h2>${esc(d.voucher.branch)} · ${esc(d.voucher.vch_no)}</h2><p>${esc(d.voucher.party_name||'')}</p><div class="table"><table><thead><tr><th>Item</th><th>Qty</th><th>Before GST</th><th>Including GST</th></tr></thead><tbody>${(d.items||[]).map(i=>`<tr><td>${esc(i.item_name)}</td><td>${esc(i.qty)}</td><td>${money(i.taxable_amount)}</td><td>${money(i.total_amount)}</td></tr>`).join('')}</tbody></table></div>`;
  $('detail').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
