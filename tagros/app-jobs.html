<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>All Jobs — TAGRO</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="os-shell.css">
  <link rel="stylesheet" href="service.css">
</head>
<body>
  <header class="service-header"></header>
  <main class="service-main">
    <div class="screen-bar">
      <a class="back-link" href="index.html" aria-label="Back">←</a>
      <div class="screen-bar-main">
        <div class="screen-title" id="list-title">All jobs</div>
        <div class="save-state" id="list-count">Loading workshop…</div>
      </div>
      <a class="primary-button" href="receive.html" style="text-decoration:none">＋ Receive</a>
    </div>
    <div class="filters">
      <input class="control" id="job-search" type="search" placeholder="Customer, phone, machine, serial or work order">
      <select class="control" id="status-filter" style="max-width:210px">
        <option value="all">Every status</option>
        <option value="received">Received</option>
        <option value="inspecting">Inspecting</option>
        <option value="repairing">Repairing</option>
        <option value="waiting_parts">Waiting for parts</option>
        <option value="ready">Ready</option>
        <option value="returned">Returned</option>
      </select>
    </div>
    <div class="job-list" id="job-list"><div class="empty">Loading work orders…</div></div>
  </main>
  <script src="os-manifest.js"></script><script src="os-core.js"></script><script src="app-shell.js"></script><script src="service-ui.js"></script>
  <script>
  let listSession=null,loadTimer=null;
  async function loadJobs(){
    const query=document.getElementById('job-search').value.trim(),status=document.getElementById('status-filter').value;
    const params=new URLSearchParams({limit:'200'});if(query)params.set('query',query);if(status!=='all')params.set('status',status);
    if(new URLSearchParams(location.search).get('mine')==='1')params.set('mine','1');
    const list=document.getElementById('job-list');list.innerHTML='<div class="empty">Finding work orders…</div>';
    try{
      const data=await Api.request('/work-orders?'+params),orders=data.workOrders||[];
      document.getElementById('list-count').textContent=orders.length+' work order'+(orders.length===1?'':'s');
      list.innerHTML=orders.length?orders.map(order=>ServiceUI.jobCard(order)).join(''):'<div class="empty">Nothing matches this search.</div>';
    }catch(error){list.innerHTML='<div class="empty">'+ServiceUI.esc(error.message)+'</div>'}
  }
  (async()=>{
    listSession=await ServiceUI.session();if(!listSession)return;ServiceUI.header(listSession);
    const params=new URLSearchParams(location.search);
    if(params.get('query'))document.getElementById('job-search').value=params.get('query');
    if(params.get('mine')==='1'){document.getElementById('list-title').textContent='My bench';document.title='My Bench — TAGRO'}
    if(params.get('status'))document.getElementById('status-filter').value=params.get('status');
    document.getElementById('job-search').addEventListener('input',()=>{clearTimeout(loadTimer);loadTimer=setTimeout(loadJobs,350)});
    document.getElementById('status-filter').addEventListener('change',loadJobs);await loadJobs();
  })();
  </script>
</body>
</html>
