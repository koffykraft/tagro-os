<style>
:root{--ink:#171717;--muted:#676767;--line:#dedede;--soft:#f5f5f3;--orange:#f56522;--green:#087c59}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,sans-serif;font-size:17px}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1040px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700}.branch{font-size:14px;color:var(--muted);margin-top:3px}.count-badge{background:var(--ink);color:#fff;border-radius:20px;padding:8px 12px;font-weight:700}.main{padding:22px 18px 110px}.step{font-size:13px;color:var(--orange);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.local{display:block;color:#707070;font-family:"Noto Sans Malayalam","Manjari","Kartika",sans-serif;font-size:14px;font-weight:400;line-height:1.4;margin-top:4px}.title{font-size:28px;margin:0 0 8px}.hint{color:var(--muted);margin:0 0 22px;line-height:1.45}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{min-height:92px;background:#fff;border:1px solid var(--line);border-radius:17px;text-align:left;padding:17px;font-weight:700}.tile:hover,.tile.active{border:2px solid var(--ink);padding:16px}.tile small{display:block;color:var(--muted);font-weight:400;margin-top:7px}.back{border:0;background:none;padding:5px 0;margin-bottom:14px;color:var(--muted)}.search{display:flex;gap:9px;margin:18px 0}.search input{width:100%;border:1px solid #bbb;border-radius:14px;padding:15px}.results{border:1px solid var(--line);border-radius:17px;overflow:hidden}.result{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:15px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:8px}.result:last-child{border:0}.part{color:var(--muted);font-size:14px;margin-top:5px}.add{color:var(--orange);font-size:24px;align-self:center}.empty{padding:24px;color:var(--muted);text-align:center}.diagram{margin:17px 0;border:1px solid var(--line);background:var(--soft);border-radius:17px;padding:16px}.diagram h3{margin:0 0 5px}.diagram-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.diagram-ref{border:1px solid #bbb;background:#fff;border-radius:12px;padding:10px 13px}.diagram-ref.active{background:var(--ink);color:#fff}.entry{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.entry h3{margin:0 0 5px}.qty{display:flex;align-items:center;gap:12px;margin-top:16px}.qty button{width:48px;height:48px;border:1px solid #bbb;background:#fff;border-radius:14px;font-size:24px}.qty input{width:90px;height:48px;border:1px solid #bbb;border-radius:14px;text-align:center}.save{flex:1;height:50px;border:0;border-radius:14px;background:var(--orange);color:#fff;font-weight:700}.list{margin-top:24px}.list h2{font-size:22px}.count-row{border-bottom:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.count-row strong{font-size:20px}.count-actions button{border:0;background:none;color:#b42318;padding:8px}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}.footer button{max-width:500px;width:50%;height:52px;border-radius:15px;font-weight:700}.secondary{background:#fff;border:1px solid #bbb}.primary{background:var(--ink);color:#fff;border:0}.hidden{display:none!important}@media(max-width:700px){.main{padding:18px 14px 110px}.tiles{grid-template-columns:1fr 1fr}.tile{min-height:82px;padding:14px}.tile:hover,.tile.active{padding:13px}.title{font-size:25px}.search{position:sticky;top:72px;background:#fff;padding:8px 0;z-index:3}.result{padding:14px}}
</style>
<style>
.quick-entry{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.quick-tools{display:grid;grid-template-columns:1fr auto;gap:9px}.quick-tools input{min-width:0;height:56px;border:1px solid #aaa;border-radius:14px;padding:0 15px}.quick-tools button{height:56px;border:1px solid var(--ink);border-radius:14px;background:#fff;padding:0 16px;font-weight:700}.quick-entry .results{margin-top:10px}.photo-queue{margin-top:14px;border:1px solid var(--line);border-radius:15px;padding:14px}.photo-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.photo-row:last-child{border:0}.photo-row img{width:52px;height:52px;border-radius:10px;object-fit:cover}.queued{font-size:13px;color:var(--orange)}@media(max-width:420px){.quick-tools{grid-template-columns:1fr}.quick-tools button{width:100%}}
.step button{border:0;background:none;color:var(--orange);padding:3px 2px;text-transform:uppercase;letter-spacing:.12em}.step button:not(:last-child)::after{content:" ·";margin-left:5px}.step button:active{text-decoration:underline}
.top-left{display:flex;align-items:center;gap:11px}.menu-button{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:21px}.drawer-shade{position:fixed;inset:0;background:rgba(0,0,0,.24);z-index:19}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(82vw,330px);z-index:20;background:#fff;padding:18px;box-shadow:15px 0 40px rgba(0,0,0,.15);transform:translateX(-105%);transition:transform .18s ease}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:10px}.drawer-head button{border:0;background:#fff;font-size:30px}.drawer>button{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:16px 4px;font-weight:700}.quick-entry.compact{margin-top:0;padding:10px 0 14px;border-top:0;border-bottom:1px solid var(--line)}.quick-entry.compact .step{display:none}.quick-entry.compact .quick-tools input,.quick-entry.compact .quick-tools button{height:48px}
</style>
<style>
button,input,select{font:inherit}button{color:var(--ink);-webkit-appearance:none;appearance:none}.branch select{border:0;background:#fff;color:var(--muted);max-width:190px;padding:2px 0}.title{margin-bottom:20px}.tile small{font-size:13px}.count-form{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}.count-form input{width:100%;height:62px;border:2px solid #aaa;border-radius:15px;padding:0 18px;text-align:center;font-size:28px}.count-form input:focus{border-color:var(--orange);outline:3px solid rgba(245,101,34,.15)}.count-form .save{display:block;width:100%;height:58px;border:0;border-radius:15px;background:var(--orange);color:#fff;font-size:18px;font-weight:700}.count-form .save:disabled{background:#ddd;color:#777}.hint{display:none}
</style>
<style>
.diagram-view{position:relative;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.diagram-view img{display:block;width:100%;max-height:62vh;object-fit:contain;background:#fff}.diagram-name{padding:11px 13px;border-top:1px solid var(--line);font-weight:700}.diagram-zoom-button{position:absolute;right:10px;top:10px;border:1px solid #999;border-radius:11px;background:#fff;padding:9px 11px;font-weight:700}.diagram-parts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px 0 2px}.diagram-part{min-width:0;border:1px solid #bbb;background:#fff;border-radius:11px;padding:10px 4px;text-align:center;font-weight:700}.diagram-part.active{border-color:var(--orange);background:#fff3ec;color:#9c380a}.result.illustrated{grid-template-columns:62px 1fr 48px;align-items:stretch;padding:0}.ref-link{border:0;border-right:1px solid var(--line);background:#fff3ec;color:#9c380a;font-weight:700;font-size:18px;padding:14px 5px}.item-link{border:0;background:#fff;text-align:left;padding:14px 12px}.result-add{border:0;background:#fff;color:var(--orange);font-size:26px}.diagram-zoom{position:fixed;inset:0;z-index:40;background:#fff;padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));overflow:auto}.diagram-zoom img{display:block;width:1450px;max-width:none;height:auto}.diagram-zoom-close{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:41;border:0;border-radius:999px;background:#111;color:#fff;width:48px;height:48px;font-size:24px}
@media(max-width:420px){.diagram-parts{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="top-left"><button id="menuButton" class="menu-button hidden" type="button" aria-label="Browse">☰</button><div><div class="brand">TAGRO · Stock Count</div><div class="branch"><select id="branchSelect"><option value="">Select branch</option><option>KVR</option><option>PKM</option><option>NDD</option><option>MDM</option><option>SKT</option><option>OYR</option><option>SDM</option></select></div></div></div><div class="count-badge"><span id="totalLines">0</span> items</div></header>
<div class="drawer-shade hidden" id="drawerShade"></div><aside class="drawer" id="drawer"><div class="drawer-head"><strong>Go to</strong><button id="closeDrawer" type="button">×</button></div><button data-nav="start">Stock count</button><button data-nav="quick">Quick entry</button><button data-nav="photos">Photo queue</button><button data-nav="counted">Counted items</button></aside>
<main class="main">
 <section id="chooser">
  <div class="step">Select section</div><h1 class="title">Stock count<span class="local" id="homeLocal">സ്റ്റോക്ക് എണ്ണം</span></h1>
  <div class="tiles" id="sectionTiles"></div>
  <section class="quick-entry">
   <div class="step">Quick entry</div>
   <div class="quick-tools"><input id="quickSearch" autocomplete="off" placeholder="Item name or part number"><button id="photoButton" type="button">Take photo</button><input id="photoInput" class="hidden" type="file" accept="image/*" capture="environment" multiple></div>
   <div class="results hidden" id="quickResults"></div>
   <div class="photo-queue hidden" id="photoQueue"><strong>Photo queue</strong><div id="photoRows"></div></div>
  </section>
 </section>
 <section id="subChooser" class="hidden"><button class="back" data-back="chooser">← Back</button><div class="step" id="subStep"></div><h1 class="title" id="subTitle"></h1><div class="tiles" id="subTiles"></div></section>
 <section id="itemChooser" class="hidden"><button class="back" data-back="subChooser">← Back</button><div class="step" id="itemStep"></div><h1 class="title" id="itemTitle"></h1>
  <div class="search"><input id="searchInput" autocomplete="off" placeholder="Type item name or part number"></div>
  <div class="diagram hidden" id="diagramBox"><h3>Parts diagram</h3><span class="local">പാർട്സ് ഡയഗ്രം</span><div class="diagram-grid" id="diagramRefs"></div><div class="diagram-view hidden" id="diagramView"><button class="diagram-zoom-button" id="diagramZoomButton" type="button">Enlarge</button><img id="diagramImage" alt="Parts diagram"><div class="diagram-name" id="diagramName"></div></div><div class="diagram-parts hidden" id="diagramParts"></div></div>
  <div class="results" id="results"></div>
 </section>
 <section id="entryPanel" class="entry hidden"><div class="step">Enter count</div><h3 id="entryName"></h3><div class="part" id="entryPart"></div><form class="count-form" id="countForm"><input id="qty" inputmode="numeric" enterkeyhint="done" pattern="[0-9]*" placeholder="Quantity" aria-label="Quantity"><button class="save" id="saveCount" type="submit">Add count</button></form></section>
 <section class="list" id="countList"><h2>Counted items <span class="local">എണ്ണിയ സാധനങ്ങൾ</span></h2><div id="countRows" class="empty">Nothing counted yet.</div></section>
</main>
<footer class="footer"><button class="secondary" id="download">Export CSV</button><button class="primary" id="submit">Save count</button></footer>
</div>
<div class="diagram-zoom hidden" id="diagramZoom"><button class="diagram-zoom-close" id="diagramZoomClose" type="button">×</button><img id="diagramZoomImage" alt="Enlarged parts diagram"></div>
<script>
const hierarchy={
 "Spare Parts":{families:["Chainsaw","Brushcutter","Blower","Other Parts"]},
 "Accessories":{families:["Saw Chain","Guide Bar","Files & Sharpening","Oils & Consumables","Other Accessories"]},
 "Machines":{families:["Chainsaw","Brushcutter","Blower","Other Machines"]}
};
const models={
 "Spare Parts|Chainsaw":["MS 170","MS 180","MS 182","MS 210","MS 211","MS 230","MS 250","MS 290 / 390","MS 380 / 381","MS 382","MS 460","MS 461","MS 462","MS 660 / 661","Other Chainsaws"],
 "Spare Parts|Brushcutter":["FS 55","FS 120 NEW","FS 120 OLD","FS 250 NEW","FS 250 OLD","FS 130","FS 400","Other Brushcutters"],
 "Spare Parts|Blower":["SR 420","SR 450","BR 600","Other Blowers"],
 "Machines|Chainsaw":["MS 170 / 180 / 182","MS 210 / 211 / 230 / 250","MS 290 / 390","MS 380 / 381 / 382","MS 460 / 461 / 462","MS 660 / 661","Other Chainsaws"],
 "Machines|Brushcutter":["FS 55","FS 120 / 250","FS 130","FS 400","Other Brushcutters"],
 "Machines|Blower":["SR 420 / 450","BR 600","Other Blowers"]
};
let catalogue=[
 {c:"Spare Parts",f:"Chainsaw",m:"MS 460 / 461 / 462",g:"Air system",n:"Air baffle, Shroud, MS 460",p:"11281416300"},
 {c:"Spare Parts",f:"Chainsaw",m:"MS 460 / 461 / 462",g:"Air system",n:"Air filter, Wire mesh, MS 460",p:"1201653"},
 {c:"Spare Parts",f:"Chainsaw",m:"MS 460 / 461 / 462",g:"Crankcase",n:"Bearing CS MS 460",p:"95230034278"},
 {c:"Spare Parts",f:"Chainsaw",m:"MS 460 / 461 / 462",g:"Crankcase",n:"Bearing FW MS 460 6202",p:"95030030346"},
 {c:"Spare Parts",f:"Chainsaw",m:"MS 460 / 461 / 462",g:"Chain brake",n:"Brake band, MS 460",p:"11281605400"},
 {c:"Spare Parts",f:"Chainsaw",m:"MS 460 / 461 / 462",g:"Carburetor",n:"Carburetor HD-16B MS 460",p:"11281200623"},
 {c:"Spare Parts",f:"Chainsaw",m:"MS 460 / 461 / 462",g:"Carburetor",n:"Carburetor Kit, MS 460",p:"11280071066"},
 {c:"Spare Parts",f:"Chainsaw",m:"MS 380 / 381 / 382",g:"Carburetor",n:"Carburetor box cover MS 382",p:"11191401907"},
 {c:"Spare Parts",f:"Chainsaw",m:"MS 380 / 381 / 382",g:"Carburetor",n:"Carburetor MS 382",p:"11191200612"},
 {c:"Spare Parts",f:"Brushcutter",m:"FS 120 / 250",g:"Air system",n:"Air filter Paper FS 120/250/400",p:"41341410300"},
 {c:"Spare Parts",f:"Brushcutter",m:"FS 120 / 250",g:"Clutch",n:"Bearing, Clutch Housing FS 120/250/400",p:"95030037450"},
 {c:"Spare Parts",f:"Brushcutter",m:"FS 120 / 250",g:"Carburetor",n:"Carburetor 4134/21 FS 120/250 2022 STIHL",p:"41341200621"},
 {c:"Spare Parts",f:"Brushcutter",m:"FS 120 / 250",g:"Carburetor",n:"Carburetor C1Q-S161 FS 120/250",p:"41341200652"},
 {c:"Spare Parts",f:"Blower",m:"SR 420 / 450",g:"Air system",n:"Air filter SR 420",p:"42031410301"},
 {c:"Spare Parts",f:"Blower",m:"SR 420 / 450",g:"Tank",n:"Bellows, Tank SR 420",p:"42037016200"},
 {c:"Spare Parts",f:"Blower",m:"SR 420 / 450",g:"Carburetor",n:"Carburetor SR 420, HD-45",p:"42031200610"},
 {c:"Accessories",f:"Saw Chain",m:"",g:"Saw chain",n:"36RSC Sawchain STIHL 1.6mm-3/8\"",p:"36210001640"},
 {c:"Accessories",f:"Files & Sharpening",m:"",g:"Files",n:"2 in 1 File Holder",p:"56057504305"},
 {c:"Machines",f:"Chainsaw",m:"MS 210 / 211 / 230 / 250",g:"Machine",n:"Chainsaw MS 250",p:"MS250"},
 {c:"Machines",f:"Chainsaw",m:"MS 380 / 381 / 382",g:"Machine",n:"Chainsaw MS 382",p:"MS382"},
 {c:"Machines",f:"Brushcutter",m:"FS 120 / 250",g:"Machine",n:"Brushcutter FS 120",p:"FS120"},
 {c:"Machines",f:"Blower",m:"SR 420 / 450",g:"Machine",n:"Mistblower SR 420",p:"SR420"}
];
let path={section:null,family:null,model:null},selected=null,activeDiagram=null,modelGroups={};
const $=id=>document.getElementById(id);let session=null,branch='';const storageKey=()=>`tagro_stock_count_v1_${branch||'trial'}`;let counts=[];
const show=id=>{['chooser','subChooser','itemChooser'].forEach(x=>$(x).classList.add('hidden'));$('entryPanel').classList.add('hidden');$('countList').classList.toggle('hidden',id!=='chooser');document.querySelector('.quick-entry').classList.toggle('compact',id!=='chooser');$('menuButton').classList.toggle('hidden',id==='chooser');$(id).classList.remove('hidden')};
function tiles(el,items,handler){el.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.className='tile';b.innerHTML=x+'<small>Open</small>';b.onclick=()=>handler(x);el.appendChild(b)})}
function breadcrumb(el,nodes){el.innerHTML='';nodes.forEach(node=>{let b=document.createElement('button');b.type='button';b.textContent=node.label;b.onclick=node.go;el.appendChild(b)})}
tiles($('sectionTiles'),['Spare Parts','Accessories','Machines'],chooseSection);
function chooseSection(x){path={section:x,family:null,model:null};breadcrumb($('subStep'),[{label:x,go:()=>show('chooser')}]);$('subTitle').innerHTML='Choose a group<span class="local">വിഭാഗം തിരഞ്ഞെടുക്കുക</span>';tiles($('subTiles'),hierarchy[x].families,chooseFamily);show('subChooser')}
function chooseFamily(x){path.family=x;let mm=models[path.section+'|'+x];if(mm){breadcrumb($('subStep'),[{label:path.section,go:()=>show('chooser')},{label:x,go:()=>{}}]);$('subTitle').innerHTML='Choose a model<span class="local">മോഡൽ തിരഞ്ഞെടുക്കുക</span>';tiles($('subTiles'),mm,chooseModel)}else{path.model='';openItems()}}
function chooseModel(x){path.model=x;openItems()}
function openItems(){let section=path.section,family=path.family,model=path.model;activeDiagram=null;breadcrumb($('itemStep'),[{label:section,go:()=>show('chooser')},{label:family,go:()=>{path={section,family:null,model:null};chooseSection(section);chooseFamily(family)}},...(model?[{label:model,go:()=>{path={section,family,model:null};chooseFamily(family)}}]:[])]);$('itemTitle').innerHTML='Select an item<span class="local">സാധനം തിരഞ്ഞെടുക്കുക</span>';$('searchInput').value='';renderDiagram();renderResults();show('itemChooser')}
function familyMatches(x){if(!path.family)return true;if(path.section==='Accessories'){let n=x.n.toLowerCase();if(path.family==='Saw Chain')return /saw\s*chain|sawchain|chain links/.test(n);if(path.family==='Guide Bar')return /guide\s*bar|guidebar/.test(n);if(path.family==='Files & Sharpening')return /file|sharp|grind/.test(n);if(path.family==='Oils & Consumables')return /oil|lubric|cleaner|grease|line/.test(n);return !/saw\s*chain|sawchain|chain links|guide\s*bar|guidebar|file|sharp|grind|oil|lubric|cleaner|grease|line/.test(n)}if(path.family==='Other Parts'||path.family==='Other Machines')return x.f==='Other';return x.f===path.family}
function preferredItem(a,b){let ap=String(a.p||''),bp=String(b.p||'');if(ap.length===11&&bp.length!==11)return a;if(bp.length===11&&ap.length!==11)return b;return ap.length<=bp.length?a:b}
function uniqueRows(rows){let map=new Map();rows.forEach(x=>{let key=(x.n||'').toLowerCase().replace(/[^a-z0-9]/g,'');map.set(key,map.has(key)?preferredItem(map.get(key),x):x)});return [...map.values()]}
function filtered(){let q=$('searchInput').value.toLowerCase().replace(/\s+/g,'');return uniqueRows(catalogue.filter(x=>x.c===path.section&&familyMatches(x)&&(!path.model||x.m===path.model)).filter(x=>!q||(x.n+x.p+x.g).toLowerCase().replace(/[^a-z0-9]/g,'').includes(q)))}
function rowId(x){return 'part-'+String(x.reference||x.p).replace(/[^a-z0-9]/gi,'-')}
function showDiagramReference(reference){$('diagramView').scrollIntoView({behavior:'smooth',block:'center'});document.querySelectorAll('.diagram-part').forEach(b=>b.classList.toggle('active',b.dataset.reference===reference));setTimeout(()=>document.querySelectorAll('.diagram-part').forEach(b=>b.classList.remove('active')),1600)}
function openDiagram(code,title,image){activeDiagram=code;$('searchInput').value='';$('diagramView').classList.toggle('hidden',!image);$('diagramParts').classList.remove('hidden');if(image)$('diagramImage').src=image;$('diagramName').textContent=code+' · '+title;document.querySelectorAll('.diagram-ref').forEach(b=>b.classList.toggle('active',b.dataset.code===code));let rows=uniqueRows(catalogue.filter(x=>x.diagram===code&&x.m===path.model));$('diagramParts').innerHTML='';rows.forEach(x=>{let b=document.createElement('button');b.className='diagram-part';b.dataset.reference=x.reference;b.textContent=x.reference;b.onclick=()=>document.getElementById(rowId(x))?.scrollIntoView({behavior:'smooth',block:'center'});$('diagramParts').appendChild(b)});renderResults()}
function renderDiagram(){let groupsForModel=modelGroups[path.model]||[];let illustrated=path.section==='Spare Parts'&&groupsForModel.length;$('diagramBox').classList.toggle('hidden',path.section!=='Spare Parts'||!path.model);$('diagramRefs').innerHTML='';$('diagramView').classList.add('hidden');$('diagramParts').classList.add('hidden');if(illustrated){groupsForModel.forEach(x=>{let b=document.createElement('button');b.className='diagram-ref';b.dataset.code=x.code;b.textContent=x.code+' · '+x.title.replace(/^[A-Z]\s*[-–]\s*/,'');b.onclick=()=>openDiagram(x.code,x.title,x.image);$('diagramRefs').appendChild(b)});let first=groupsForModel.find(x=>x.image)||groupsForModel[0];if(first)openDiagram(first.code,first.title,first.image);return}let rows=filtered(),groups=[...new Set(rows.map(x=>x.g))];groups.forEach(g=>{let b=document.createElement('button');b.className='diagram-ref';b.textContent=g;b.onclick=()=>{$('searchInput').value=g;renderResults()};$('diagramRefs').appendChild(b)})}
function renderResults(){let rows=filtered();if(activeDiagram)rows=rows.filter(x=>x.diagram===activeDiagram);$('results').innerHTML='';if(!rows.length){$('results').innerHTML='<div class="empty">No item found</div>';return}rows.forEach(x=>{if(x.reference&&activeDiagram){let r=document.createElement('div');r.className='result illustrated';r.id=rowId(x);let ref=document.createElement('button');ref.className='ref-link';ref.textContent=x.reference;ref.onclick=()=>showDiagramReference(x.reference);let item=document.createElement('button');item.className='item-link';item.innerHTML='<strong>'+x.n+'</strong><span class="part">'+(x.p||'No part number')+' · '+x.g+'</span>';item.onclick=()=>selectItem(x);let add=document.createElement('button');add.className='result-add';add.textContent='＋';add.onclick=()=>selectItem(x);r.append(ref,item,add);$('results').appendChild(r);return}let b=document.createElement('button');b.className='result';b.innerHTML='<span><strong>'+x.n+'</strong><span class="part">'+(x.p||'No part number')+' · '+x.g+'</span></span><span class="add">＋</span>';b.onclick=()=>selectItem(x);$('results').appendChild(b)})}
function quickMatches(query){let words=query.toLowerCase().trim().split(/\s+/).map(w=>w.replace(/[^a-z0-9]/g,'')).filter(w=>w.length>1);if(!words.length)return[];return uniqueRows(catalogue.filter(x=>{let hay=(x.n+' '+x.p+' '+x.c+' '+x.f+' '+x.m).toLowerCase().replace(/[^a-z0-9]/g,'');return words.every(w=>hay.includes(w)||(w.endsWith('s')&&hay.includes(w.slice(0,-1))))})).slice(0,20)}
function renderQuick(){let rows=quickMatches($('quickSearch').value),box=$('quickResults');box.innerHTML='';box.classList.toggle('hidden',!rows.length);rows.forEach(x=>{let b=document.createElement('button');b.className='result';let location=[x.c,x.f,x.m].filter(Boolean).join(' · ');b.innerHTML='<span><strong>'+x.n+'</strong><span class="part">'+(x.p||'No part number')+' · '+location+'</span></span><span class="add">＋</span>';b.onclick=()=>selectItem(x);box.appendChild(b)})}
function selectItem(x){if(!branch){$('branchSelect').focus();alert('Select branch');return}selected=x;$('entryName').textContent=x.n;$('entryPart').textContent=(x.p||'No part number')+' · '+x.c;$('qty').value='';$('entryPanel').classList.remove('hidden');$('countList').classList.remove('hidden');$('entryPanel').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>$('qty').focus(),250)}
$('searchInput').oninput=()=>{activeDiagram=null;document.querySelectorAll('.diagram-ref').forEach(b=>b.classList.remove('active'));$('diagramView').classList.add('hidden');$('diagramParts').classList.add('hidden');renderResults()};
$('diagramZoomButton').onclick=()=>{if(!$('diagramImage').src)return;$('diagramZoomImage').src=$('diagramImage').src;$('diagramZoom').classList.remove('hidden')};
$('diagramZoomClose').onclick=()=>$('diagramZoom').classList.add('hidden');
$('quickSearch').oninput=renderQuick;
$('chooser').parentNode.insertBefore(document.querySelector('.quick-entry'),$('chooser'));
function closeDrawer(){$('drawer').classList.remove('open');$('drawerShade').classList.add('hidden')}
$('menuButton').onclick=()=>{$('drawer').classList.add('open');$('drawerShade').classList.remove('hidden')};$('closeDrawer').onclick=closeDrawer;$('drawerShade').onclick=closeDrawer;
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let target=b.dataset.nav;closeDrawer();if(target==='start'){show('chooser');return}if(target==='quick'){show('chooser');setTimeout(()=>$('quickSearch').focus(),100);return}if(target==='photos'){show('chooser');$('photoQueue').scrollIntoView({behavior:'smooth'});return}show('chooser');$('countList').scrollIntoView({behavior:'smooth'})});
$('countForm').onsubmit=e=>{e.preventDefault();let raw=$('qty').value.trim();if(!selected||raw===''||!/^\d+$/.test(raw))return;let q=Number(raw);let key=selected.p||selected.n;let old=counts.find(x=>(x.p||x.n)===key);if(old)old.q=q;else counts.push({...selected,q});persist();$('entryPanel').classList.add('hidden');selected=null};
function persist(){localStorage.setItem(storageKey(),JSON.stringify(counts));renderCounts()}
function renderCounts(){$('totalLines').textContent=counts.length;let el=$('countRows');if(!counts.length){el.className='empty';el.innerHTML='Nothing counted yet.';return}el.className='';el.innerHTML='';counts.slice().sort((a,b)=>['Spare Parts','Accessories','Machines'].indexOf(a.c)-['Spare Parts','Accessories','Machines'].indexOf(b.c)||a.n.localeCompare(b.n)).forEach(x=>{let r=document.createElement('div');r.className='count-row';r.innerHTML='<div><strong>'+x.q+'</strong> · '+x.n+'<div class="part">'+x.p+' · '+x.c+'</div></div><div class="count-actions"><button>Remove</button></div>';r.querySelector('button').onclick=()=>{counts=counts.filter(y=>y.p!==x.p);persist()};el.appendChild(r)})}
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{if(b.dataset.back==='chooser')show('chooser');else{chooseSection(path.section)}});
$('download').onclick=()=>{let csv='Category,Family,Model,TAGRO item,Part number,Count\n'+counts.map(x=>[x.c,x.f,x.m,x.n,x.p,x.q].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='TAGRO_stock_count.csv';a.click()};
$('submit').onclick=async()=>{if(!counts.length){alert('Add at least one counted item');return}$('submit').disabled=true;try{let result=await Api.request('/stock-count/submissions',{method:'POST',body:JSON.stringify({deviceReference:navigator.userAgent.slice(0,100),entries:counts.map(x=>({itemName:x.n,partNumber:x.p,category:x.c,quantity:x.q,source:'manual'}))})});localStorage.setItem(`tagro_stock_count_submitted_v2_${branch}`,JSON.stringify({branch,savedAt:result.createdAt,submissionId:result.submissionId,items:counts}));localStorage.removeItem(storageKey());counts=[];renderCounts();alert('Count saved · '+result.entryCount+' items')}catch(error){persist();alert('Kept safely on this phone. Try Save count again when connected.')}finally{$('submit').disabled=false}};
const photoDb=()=>new Promise((resolve,reject)=>{let req=indexedDB.open('tagro_stock_photos',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function queuedPhotos(){let db=await photoDb();return new Promise((resolve,reject)=>{let req=db.transaction('photos').objectStore('photos').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function renderPhotos(){let rows=await queuedPhotos().catch(()=>[]);$('photoQueue').classList.toggle('hidden',!rows.length);$('photoRows').innerHTML='';rows.sort((a,b)=>b.created-a.created).forEach(x=>{let row=document.createElement('div');row.className='photo-row';let url=URL.createObjectURL(x.file);row.innerHTML='<img alt="Part photo"><div><strong>'+x.name+'</strong><div class="part">'+(x.branch||'Branch not selected')+'</div></div><span class="queued">Queued</span>';row.querySelector('img').src=url;$('photoRows').appendChild(row)})}
$('photoButton').onclick=()=>{if(!branch){$('branchSelect').focus();alert('Select branch');return}$('photoInput').click()};
$('photoInput').onchange=async e=>{let db=await photoDb();let tx=db.transaction('photos','readwrite'),store=tx.objectStore('photos');for(let file of e.target.files)store.put({id:crypto.randomUUID(),branch,name:file.name||'Part photo',type:file.type,created:Date.now(),status:'queued',file});tx.oncomplete=()=>{e.target.value='';renderPhotos()}};
async function bootOs(){session=await Session.restore();if(!session){location.replace('../login.html');return}branch=session.branch;$('branchSelect').innerHTML='<option>'+branch+'</option>';$('branchSelect').value=branch;$('branchSelect').disabled=true;counts=JSON.parse(localStorage.getItem(storageKey())||'[]');$('homeLocal').textContent=branch==='SKT'?'இருப்பு எண்ணிக்கை':'സ്റ്റോക്ക് എണ്ണം';renderCounts()}
Promise.all([bootOs(),fetch('./catalogue.json?v=2026072705',{cache:'no-store'}).then(r=>r.json()),fetch('./model-catalogues.json?v=2026072702',{cache:'no-store'}).then(r=>r.json())]).then(([,base,modelsData])=>{catalogue=Array.isArray(base.items)?base.items:catalogue;if(Array.isArray(modelsData.models))modelsData.models.forEach(model=>{modelGroups[model.model]=model.groups||[];if(Array.isArray(model.items))catalogue=catalogue.concat(model.items)});renderQuick();if(path.model)renderDiagram();}).catch(()=>{});renderPhotos();
</script></body></html>
