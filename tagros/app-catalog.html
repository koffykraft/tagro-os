<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Pick Parts — TAGRO</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="os-design-system.css">
  <link rel="stylesheet" href="parts-line-picker.css">
</head>
<body class="parts-line-picker-page">
  <main class="parts-picker-app" id="parts-picker-app">
    <header class="parts-picker-header">
      <div class="parts-picker-title-row">
        <h1>Pick Parts</h1>
        <button id="picker-done" type="button">Done</button>
      </div>
      <div class="picker-context" id="picker-context">
        <div class="picker-context-primary">
          <span>Machine: <strong id="picker-machine">Any machine</strong></span>
          <span>Add to: <strong id="picker-destination">My pick list</strong></span>
        </div>
        <div class="picker-plane-state" id="picker-plane-state" hidden>
          <span>Working with</span><strong id="picker-plane-model"></strong>
        </div>
        <div class="picker-context-detail" id="picker-job-context" hidden>
          <p><span>Customer</span><strong id="picker-customer"></strong></p>
          <p><span>Complaint</span><strong id="picker-complaint"></strong></p>
          <p class="picker-observation" id="picker-observation-row" hidden><span>Inspection note</span><strong id="picker-observation"></strong></p>
        </div>
      </div>
    </header>

    <section class="parts-lines" id="parts-lines" aria-label="Parts lines"></section>

    <footer class="parts-picker-footer">
      <div class="parts-picker-summary">
        <span><strong id="selected-count">0</strong> parts</span>
        <strong id="selected-total">₹0</strong>
      </div>
      <button class="parts-picker-submit" id="add-selected-parts" type="button" disabled>Add to Job / Estimate</button>
      <p class="parts-picker-message" id="parts-picker-message" role="status" aria-live="polite"></p>
    </footer>
  </main>

  <script src="os-manifest.js"></script>
  <script src="os-core.js"></script>
  <script src="parts-line-picker.js"></script>
</body>
</html>
